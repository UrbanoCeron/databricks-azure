# This is a Declarative Automation Bundle definition for azure_devops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: azure_devops
  uuid: c67173d9-250a-4ab8-9506-c482b9117825

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610796861852.12.azuredatabricks.net
    variables:
      catalog: unity
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405610796861852.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/lend_urology586@simplelogin.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lend_urology586@simplelogin.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: unity
      schema: prod
    permissions:
      - user_name: lend_urology586@simplelogin.com
        level: CAN_MANAGE
